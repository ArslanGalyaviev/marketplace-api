services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    image: liquibase/liquibase:4.29
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/changelog:/liquibase/changelog
    command: --url=jdbc:postgresql://db:5432/marketplace --username=student --password=student --changelog-file=changelog/changelog.xml update
  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://student:student@db:5432/marketplace
    ports:
      - "8000:8000"
volumes:
  postgres_data:
